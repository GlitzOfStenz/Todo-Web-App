<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Todo List</title>
  <style>
    :root {
      --bg-color: #0a192f;         
      --card-color: #112240;       
      --accent-color: #64ffda;     
      --text-color: #e6f1ff;       
      --muted-text: #8892b0;       
      --danger-color: #ff4b5c;    
      --button-hover: #5fe0c5;
      --font-main: "Poppins", sans-serif;
    }

    body {
      font-family: var(--font-main);
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 50px 10px;
    }

    .container {
      width: 420px;
      background: var(--card-color);
      padding: 25px 25px 35px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--accent-color);
      text-align: center;
      letter-spacing: 1px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin: 14px 0 18px;
    }

    input#addTask {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #1c3150;
      color: var(--text-color);
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    input#addTask:focus {
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 6px var(--accent-color);
    }

    button {
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.25s;
    }

    button#submit {
      background: var(--accent-color);
      color: #0a192f;
    }

    button#submit:hover {
      background: var(--button-hover);
      box-shadow: 0 0 10px var(--accent-color);
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li.task {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #172a45;
      padding: 10px 14px;
      margin: 10px 0;
      border-radius: 10px;
      transition: 0.2s;
    }

    li.task:hover {
      background: #1e3a5f;
      transform: scale(1.02);
    }

    .task-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      flex-direction: column;
    }

    .task-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-color);
      word-break: break-word;
    }

    .timestamp {
      font-size: 11px;
      color: var(--muted-text);
    }

    .done .task-title {
      text-decoration: line-through;
      color: var(--muted-text);
    }

    .controls button {
      background: transparent;
      color: var(--accent-color);
      font-size: 16px;
    }

    .controls button:hover {
      color: var(--danger-color);
      transform: scale(1.2);
    }

    h3 {
      margin-top: 22px;
      margin-bottom: 8px;
      color: var(--accent-color);
      border-bottom: 1px solid var(--accent-color);
      padding-bottom: 4px;
    }

    .small {
      font-size: 13px;
      color: var(--muted-text);
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Todo</h2>

    <div class="input-row">
      <input id="addTask" type="text" placeholder="Add a new task...">
      <button id="submit">Add</button>
    </div>

    <div class="small">Pending</div>
    <ul id="todolist"></ul>

    <h3>Completed</h3>
    <ul id="donelist"></ul>
  </div>

</div>


  <script>
    let list = [];
    const submit = document.getElementById('submit');
    const addTask = document.getElementById('addTask');
    const todoList = document.getElementById('todolist');
    const doneList = document.getElementById('donelist');
    const STORAGE_KEY = 'todoList_v2';

    function loadTasks() {
      const raw = localStorage.getItem(STORAGE_KEY);
      list = raw ? JSON.parse(raw) : [];
      renderTasks();
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function renderTasks() {
      todoList.innerHTML = '';
      doneList.innerHTML = '';
      list.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task' + (task.done ? ' done' : '');
        const left = document.createElement('div');
        left.className = 'task-left';

        const title = document.createElement('div');
        title.className = 'task-title';
        title.textContent = task.text;

        const ts = document.createElement('div');
        ts.className = 'timestamp';
        ts.textContent = new Date(task.createdAt).toLocaleString();

        left.appendChild(title);
        left.appendChild(ts);

        const controls = document.createElement('div');
        controls.className = 'controls';

        const doneBtn = document.createElement('button');
        doneBtn.textContent = task.done ? '↺' : '✔';
        doneBtn.onclick = () => toggleComplete(index);

        const editBtn = document.createElement('button');
        editBtn.textContent = '✏️';
        editBtn.onclick = () => editTask(index);

        const delBtn = document.createElement('button');
        delBtn.textContent = '❌';
        delBtn.onclick = () => removeTask(index);

        controls.append(doneBtn, editBtn, delBtn);
        li.append(left, controls);

        if (task.done) doneList.appendChild(li);
        else todoList.appendChild(li);
      });
    }

    submit.addEventListener('click', () => {
      const text = addTask.value.trim();
      if (!text) return;
      list.push({ text, done: false, createdAt: new Date().toISOString() });
      addTask.value = '';
      saveTasks();
      renderTasks();
    });

    addTask.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit.click();
    });

    function toggleComplete(index) {
      list[index].done = !list[index].done;
      saveTasks();
      renderTasks();
    }

    function editTask(index) {
      const newText = prompt('Edit task:', list[index].text);
      if (newText !== null && newText.trim() !== '') {
        list[index].text = newText.trim();
        saveTasks();
        renderTasks();
      }
    }

    function removeTask(index) {
      if (confirm('Remove this task?')) {
        list.splice(index, 1);
        saveTasks();
        renderTasks();
      }
    }

    loadTasks();
  </script>
</body>
</html>
